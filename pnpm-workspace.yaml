packages:
  - packages/*
# Native peers belong to the optional Expo host, not the public installation.
autoInstallPeers: false
catalog:
  "@ukladjs/core": ^0.2.4
  "@ukladjs/persist": ^0.2.0
allowBuilds:
  bson: false
  esbuild: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
engineStrict: true
trustPolicy: no-downgrade
# GHSA-g3hv-75wg-m249: remove when typescript-eslint adopts the patched major.
overrides:
  "@typescript-eslint/typescript-estree>minimatch": 11.0.8
# Share identical runtime packages across the independent linked installations.
virtualStoreType: global
